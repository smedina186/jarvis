name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # GitHub's dependency-review-action cannot run while Dependency graph is
      # unavailable for this repository. Audit the actual locked dependencies
      # instead, so the PR keeps a working security gate (without bypassing it).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify dependency integrity
        working-directory: frontend
        run: npm ci

      - name: Audit installed dependency signatures
        working-directory: frontend
        run: npm audit signatures

      - name: Block high and critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
