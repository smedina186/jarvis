name: Hosting preflight (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-locked-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify no-publication guards
        run: node --test scripts/netlify-preflight.test.mjs
      - name: No deployment action
        run: echo "Preparation only. No deploy, upload, paid service or publication is performed."
