# RESEARCH: opennextjs/opennextjs-netlify and Netlify Next.js/ignore-build docs.
# DECISION: Use Netlify's automatic OpenNext adapter; retain SSR and Auth.js.
# No static export. Builds remain locked until the owner authorizes publication.
[build]
  base = "frontend"
  publish = ".next"
  command = "npm run build:netlify"
  ignore = "node ./../scripts/netlify-preflight.mjs --ignore"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  JARVIS_HOSTING_PLAN = "free"

# Previews/branch deploys must not receive production secrets or serve the app.
[context.deploy-preview]
  command = "node -e \"console.error('Deploy previews are disabled'); process.exit(1)\""

[context.branch-deploy]
  command = "node -e \"console.error('Branch deploys are disabled'); process.exit(1)\""
