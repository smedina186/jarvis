# Preparation only. Budget $0: Free only; never add a card or activate paid services.
services:
  - type: web
    name: jarvis-private-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.private
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: JARVIS_ENV
        value: production
      - key: JARVIS_PERSONAL_MODE
        value: "true"
      - key: JARVIS_OWNER_GITHUB_ID
        sync: false
      - key: JARVIS_BACKEND_AUTH_SECRET
        sync: false
